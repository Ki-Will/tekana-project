  #   volumes:
  #     - ./logs:/app/logs
  #     - rtmp_recordings:/tmp/recordings
  #   profiles: ["development", "production"]
  rtmp:
    image: tiangolo/nginx-rtmp
    container_name: tekana_rtmp
    ports:
      - "1935:1935"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - rtmp_recordings:/tmp/recordings
    depends_on:
      - minio
      - app
    profiles: ["development", "production"]

volumes:
  postgres_data:
  minio_data:
  rtmp_recordings:

